<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSM Inspector — TrafficSim</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --c-bg:         #080c12;
            --c-chrome:     #0d1117;
            --c-dock:       #0d1117;
            --c-dock-hdr:   #0a0f1a;
            --c-border:     rgba(255,255,255,0.07);
            --c-border-hi:  rgba(0,200,255,0.22);
            --c-accent:     #00c8f0;
            --c-ok:         #00e87a;
            --c-text:       #94a3b8;
            --c-text-hi:    #cbd5e1;
            --c-text-dim:   #334155;
            --c-text-label: #5a7888;
        }

        html, body { height: 100%; overflow: hidden; background: var(--c-bg);
            color: var(--c-text); font-family: system-ui, -apple-system, sans-serif;
            font-size: 12px; display: flex; }

        /* ── Left sidebar ──────────────────────────────────────────────── */
        #sidebar {
            width: 264px; flex-shrink: 0;
            background: var(--c-dock); border-right: 1px solid var(--c-border);
            display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .dock-hdr {
            height: 38px; padding: 0 14px;
            display: flex; align-items: center; gap: 8px;
            background: var(--c-chrome); border-bottom: 1px solid var(--c-border);
            font-size: 13px; font-weight: 700; color: var(--c-text-hi); flex-shrink: 0;
            position: sticky; top: 0; z-index: 2;
        }
        .dock-hdr-logo { color: var(--c-accent); font-size: 16px; }

        .nav-links {
            display: flex; align-items: center; gap: 4px;
            padding: 10px 12px; border-bottom: 1px solid var(--c-border); flex-shrink: 0;
        }
        .nav-link {
            padding: 4px 10px; border-radius: 4px; font-size: 11px;
            color: var(--c-text-dim); text-decoration: none; border: 1px solid transparent;
            transition: all 0.15s;
        }
        .nav-link:hover { color: var(--c-text-hi); border-color: var(--c-border); background: rgba(255,255,255,0.04); }

        .section { border-bottom: 1px solid var(--c-border); flex-shrink: 0; }
        .section-hdr {
            height: 28px; padding: 0 14px;
            display: flex; align-items: center;
            font-size: 10px; font-weight: 700; letter-spacing: 0.7px;
            text-transform: uppercase; color: var(--c-text-label);
            background: var(--c-dock-hdr); border-bottom: 1px solid var(--c-border);
        }
        .section-body { padding: 8px 12px; }

        .check-row {
            display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer;
        }
        .check-row input[type=checkbox] { accent-color: var(--c-accent); }
        .check-label { font-size: 11px; color: var(--c-text); }

        .field-row { padding: 4px 0; }
        .field-label { display: block; font-size: 10px; color: var(--c-text-label); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
        .field-input {
            width: 100%; padding: 5px 8px; border-radius: 4px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--c-border);
            color: var(--c-text-hi); font-size: 11px; outline: none; font-family: inherit;
            transition: border-color 0.15s;
        }
        .field-input:focus { border-color: var(--c-border-hi); }
        select.field-input { cursor: pointer; }

        #stats {
            margin-top: auto; padding: 10px 12px;
            font-family: monospace; font-size: 10px; color: var(--c-text-dim);
            border-top: 1px solid var(--c-border);
        }

        /* ── Canvas area ───────────────────────────────────────────────── */
        #canvas-container { flex: 1; position: relative; overflow: hidden; background: var(--c-bg); }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="dock-hdr">
        <span class="dock-hdr-logo">⊞</span> OSM Inspector
    </div>

    <div class="nav-links">
        <a href="/app"           class="nav-link">&#8592; App</a>
        <a href="/editor.html"   class="nav-link">&#9998; Editor</a>
        <a href="/map-selector.html" class="nav-link">&#9678; Map Selector</a>
    </div>

    <div class="section">
        <div class="section-hdr">Display</div>
        <div class="section-body">
            <label class="check-row"><input type="checkbox" id="showNodes" checked><span class="check-label">Show Nodes</span></label>
            <label class="check-row"><input type="checkbox" id="showWays"  checked><span class="check-label">Show Ways</span></label>
            <label class="check-row"><input type="checkbox" id="showTrafficLights" checked><span class="check-label">Emphasize Traffic Lights</span></label>
        </div>
    </div>

    <div class="section">
        <div class="section-hdr">Overlay</div>
        <div class="section-body">
            <label class="check-row"><input type="checkbox" id="showCalcLanes" checked><span class="check-label">Calculated Lanes</span></label>
            <label class="check-row"><input type="checkbox" id="showCalcPaths" checked><span class="check-label">Intersection Paths</span></label>
        </div>
    </div>

    <div class="section">
        <div class="section-hdr">Filter</div>
        <div class="section-body">
            <div class="field-row">
                <label class="field-label">Road type</label>
                <select class="field-input" id="filterRoadType">
                    <option value="-1">All Types</option>
                    <option value="0">Motorway</option>
                    <option value="1">Trunk</option>
                    <option value="2">Primary</option>
                    <option value="3">Secondary</option>
                    <option value="4">Tertiary</option>
                    <option value="5">Residential</option>
                </select>
            </div>
            <div class="field-row" style="margin-top:6px">
                <label class="field-label">Highlight Way ID</label>
                <input type="text" class="field-input" id="filterWay" placeholder="Click a way or enter ID">
            </div>
        </div>
    </div>

    <div id="stats">Loading data…</div>
</div>

<div id="canvas-container">
    <canvas id="osmCanvas"></canvas>
</div>

<script type="module" src="osm.js"></script>
</body>
</html>
