stages:
  - build

.kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USER\",\"password\":\"$DOCKERHUB_TOKEN\"}}}"
      > /kaniko/.docker/config.json

build-backend:
  extends: .kaniko
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $DOCKERHUB_USER/trafficsim-backend:$CI_COMMIT_TAG
      --destination $DOCKERHUB_USER/trafficsim-backend:latest

build-frontend:
  extends: .kaniko
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile.frontend
      --destination $DOCKERHUB_USER/trafficsim-frontend:$CI_COMMIT_TAG
      --destination $DOCKERHUB_USER/trafficsim-frontend:latest

build-db:
  extends: .kaniko
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile.db
      --destination $DOCKERHUB_USER/trafficsim-db:$CI_COMMIT_TAG
      --destination $DOCKERHUB_USER/trafficsim-db:latest